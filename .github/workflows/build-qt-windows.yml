name: Build Qt for Windows

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

jobs:
  build:
    name: Qt ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            vc_component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          - arch: arm64
            runner: windows-11-arm
            vc_component: Microsoft.VisualStudio.Component.VC.Tools.ARM64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Qt
        shell: cmd
        run: |
          set "PATH=%PATH%;%ProgramFiles(x86)%\Microsoft Visual Studio\Installer"
          for /f "usebackq tokens=*" %%i in (`vswhere.exe -latest -products * -requires ${{ matrix.vc_component }} -property installationPath`) do set "VSINSTALLDIR=%%i"
          if not defined VSINSTALLDIR (
            echo Visual Studio C++ tools not found. 1>&2
            exit /b 1
          )
          call "%VSINSTALLDIR%\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.arch }}
          if errorlevel 1 exit /b %errorlevel%
          set "CC=cl"
          set "CXX=cl"
          cmake --workflow --preset qt-${{ matrix.arch }}

      - name: Compute artifact name
        id: meta
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME -replace '[^A-Za-z0-9._-]', '-'
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Stage Qt
        shell: pwsh
        run: |
          $arch = '${{ matrix.arch }}'
          $install = "install/Windows/$arch"
          if (-not (Test-Path $install)) {
            throw "Qt install directory not found: $install"
          }

          $stage = "stage/qt-windows-$arch"
          if (Test-Path $stage) {
            Remove-Item -Recurse -Force $stage
          }
          New-Item -ItemType Directory -Force -Path (Split-Path $stage) | Out-Null
          Move-Item -Path $install -Destination $stage

      - name: Stage Qt symbols
        id: symbols
        shell: pwsh
        run: |
          $arch = '${{ matrix.arch }}'
          $pdb = "build/$arch/pdb"
          if (Test-Path $pdb) {
            $stage = "stage/qt-windows-$arch-symbols"
            if (Test-Path $stage) {
              Remove-Item -Recurse -Force $stage
            }
            New-Item -ItemType Directory -Force -Path (Split-Path $stage) | Out-Null
            Move-Item -Path $pdb -Destination $stage
            "has_symbols=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "has_symbols=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Upload Qt
        uses: actions/upload-artifact@v7
        with:
          name: qt-windows-${{ matrix.arch }}-${{ steps.meta.outputs.tag }}
          path: stage/qt-windows-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Qt symbols
        if: steps.symbols.outputs.has_symbols == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: qt-windows-${{ matrix.arch }}-symbols-${{ steps.meta.outputs.tag }}
          path: stage/qt-windows-${{ matrix.arch }}-symbols
          if-no-files-found: error
          retention-days: 30
