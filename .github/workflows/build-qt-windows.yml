name: Build Qt for Windows

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

jobs:
  build:
    name: Qt ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm

    steps:
      - uses: actions/checkout@v7

      - name: Build Qt
        run: cmake --workflow --preset qt-${{ matrix.arch }}

      - name: Upload Qt
        uses: actions/upload-artifact@v7
        with:
          name: qt-windows-${{ matrix.arch }}
          path: install/Windows/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Qt symbols
        uses: actions/upload-artifact@v7
        with:
          name: qt-windows-${{ matrix.arch }}-symbols
          path: build/${{ matrix.arch }}/pdb
          if-no-files-found: ignore
          retention-days: 30
